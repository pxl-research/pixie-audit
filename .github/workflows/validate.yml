name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: audit_env
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI env file from environment secrets
        env:
          CI_AUDIT_INGEST_API_KEY: ${{ secrets.AUDIT_INGEST_API_KEY }}
          CI_AUDIT_READ_API_KEY: ${{ secrets.AUDIT_READ_API_KEY }}
          CI_AUDIT_AUTH_USER: ${{ secrets.AUDIT_AUTH_USER }}
          CI_AUDIT_AUTH_PASSWORD_HASH: ${{ secrets.AUDIT_AUTH_PASSWORD_HASH }}
          CI_AUDIT_SESSION_SECRET: ${{ secrets.AUDIT_SESSION_SECRET }}
          CI_SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}
        run: |
          required=(
            CI_AUDIT_INGEST_API_KEY
            CI_AUDIT_READ_API_KEY
            CI_AUDIT_AUTH_USER
            CI_AUDIT_AUTH_PASSWORD_HASH
            CI_AUDIT_SESSION_SECRET
            CI_SMOKE_AUTH_PASSWORD
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required CI secret: ${name}"
              exit 1
            fi
          done

          # Normalize copied hash secrets: remove CR/LF and optional wrapping quotes.
          ci_password_hash="${CI_AUDIT_AUTH_PASSWORD_HASH//$'\r'/}"
          ci_password_hash="${ci_password_hash//$'\n'/}"
          if [[ "$ci_password_hash" == \'*\' && "$ci_password_hash" == *\' ]]; then
            ci_password_hash="${ci_password_hash:1:${#ci_password_hash}-2}"
          fi
          if [[ "$ci_password_hash" == \"*\" && "$ci_password_hash" == *\" ]]; then
            ci_password_hash="${ci_password_hash:1:${#ci_password_hash}-2}"
          fi
          if [ -z "$ci_password_hash" ]; then
            echo "AUDIT_AUTH_PASSWORD_HASH resolves to empty after normalization"
            exit 1
          fi

          cat > .env <<EOF
          POSTGRES_DB=audit
          POSTGRES_USER=audit
          POSTGRES_PASSWORD=audit
          AUDIT_DB_URL=postgres://audit:audit@audit-db:5432/audit
          LOG_LEVEL=info
          AUDIT_INGEST_API_KEY=${CI_AUDIT_INGEST_API_KEY}
          AUDIT_READ_API_KEY=${CI_AUDIT_READ_API_KEY}
          AUDIT_AUTH_USER=${CI_AUDIT_AUTH_USER}
          AUDIT_AUTH_PASSWORD_HASH='${ci_password_hash}'
          AUDIT_SESSION_SECRET=${CI_AUDIT_SESSION_SECRET}
          AUDIT_SESSION_TTL_SECONDS=1800
          AUDIT_ALLOW_UNAUTHENTICATED_READS=false
          AUDIT_SESSION_COOKIE_SECURE=false
          EOF

          echo "SMOKE_AUTH_USER=${CI_AUDIT_AUTH_USER}" >> "$GITHUB_ENV"
          echo "SMOKE_AUTH_PASSWORD=${CI_SMOKE_AUTH_PASSWORD}" >> "$GITHUB_ENV"

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Health check (retry)
        run: |
          attempts=30
          for i in $(seq 1 "$attempts"); do
            if docker compose exec -T audit-api uv run python -c "import urllib.request, json; print(json.loads(urllib.request.urlopen('http://localhost:8000/health', timeout=5).read().decode()))"; then
              echo "Health check succeeded on attempt ${i}/${attempts}"
              exit 0
            fi
            echo "Health check attempt ${i}/${attempts} failed, retrying in 2s..."
            sleep 2
          done

          echo "Health check did not become ready within retry window."
          docker compose ps
          docker compose logs --no-color --tail=200 audit-db audit-api
          exit 1

      - name: Compileall
        run: |
          docker compose run --rm audit-api sh -lc "uv sync --frozen --group dev && uv run python -m compileall app tests"

      - name: Black check
        run: |
          docker compose run --rm audit-api sh -lc "uv sync --frozen --group dev && uv tool run black --check app tests"

      - name: Ruff check
        run: |
          docker compose run --rm audit-api sh -lc "uv sync --frozen --group dev && uv tool run ruff check app tests"

      - name: Ty check
        run: |
          docker compose run --rm audit-api sh -lc "uv sync --frozen --group dev && uv tool run ty check"

      - name: Pytest
        run: |
          docker compose run --rm audit-api sh -lc "uv sync --frozen --group dev && uv run pytest"

      - name: Contract smoke
        run: |
          docker compose exec -T audit-api uv run python -m tests.smoke.audit_event_contract

      - name: Verify auth smoke credential pair
        run: |
          docker compose exec -T -e SMOKE_AUTH_PASSWORD="$SMOKE_AUTH_PASSWORD" audit-api uv run python - <<'PY'
          import os
          from argon2 import PasswordHasher
          from argon2.exceptions import InvalidHashError, VerifyMismatchError
          from app import settings

          smoke_password = os.getenv("SMOKE_AUTH_PASSWORD", "")
          auth_hash = settings.AUDIT_AUTH_PASSWORD_HASH or ""

          if not smoke_password:
              raise SystemExit("SMOKE_AUTH_PASSWORD is empty in workflow environment")
          if not auth_hash:
              raise SystemExit("AUDIT_AUTH_PASSWORD_HASH is empty in runtime settings")

          try:
              PasswordHasher().verify(auth_hash, smoke_password)
          except InvalidHashError as exc:
              raise SystemExit(
                  "AUDIT_AUTH_PASSWORD_HASH has invalid format after compose env loading"
              ) from exc
          except VerifyMismatchError as exc:
              raise SystemExit(
                  "SMOKE_AUTH_PASSWORD does not match AUDIT_AUTH_PASSWORD_HASH"
              ) from exc

          print("Auth smoke credentials verify successfully.")
          PY

      - name: Auth smoke
        run: |
          docker compose exec -T \
            -e SMOKE_AUTH_USER="$SMOKE_AUTH_USER" \
            -e SMOKE_AUTH_PASSWORD="$SMOKE_AUTH_PASSWORD" \
            audit-api uv run python -m tests.smoke.auth_login_flow

      - name: Security baseline (ruff S, bandit, pip-audit)
        run: |
          docker compose run --rm audit-api sh -lc "uv sync --frozen --group dev && uv tool run ruff check app --select S"
          docker compose run --rm audit-api sh -lc "uv sync --frozen --group dev && uv tool run bandit -r app"
          docker compose run --rm audit-api sh -lc "uv sync --frozen --group dev && uv tool run pip-audit"

      - name: Shutdown stack
        if: always()
        run: docker compose down -v

  security:
    runs-on: ubuntu-latest
    environment: audit_env
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI env file from environment secrets
        env:
          CI_AUDIT_INGEST_API_KEY: ${{ secrets.AUDIT_INGEST_API_KEY }}
          CI_AUDIT_READ_API_KEY: ${{ secrets.AUDIT_READ_API_KEY }}
          CI_AUDIT_AUTH_USER: ${{ secrets.AUDIT_AUTH_USER }}
          CI_AUDIT_AUTH_PASSWORD_HASH: ${{ secrets.AUDIT_AUTH_PASSWORD_HASH }}
          CI_AUDIT_SESSION_SECRET: ${{ secrets.AUDIT_SESSION_SECRET }}
        run: |
          required=(
            CI_AUDIT_INGEST_API_KEY
            CI_AUDIT_READ_API_KEY
            CI_AUDIT_AUTH_USER
            CI_AUDIT_AUTH_PASSWORD_HASH
            CI_AUDIT_SESSION_SECRET
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required CI secret: ${name}"
              exit 1
            fi
          done

          # Normalize copied hash secrets: remove CR/LF and optional wrapping quotes.
          ci_password_hash="${CI_AUDIT_AUTH_PASSWORD_HASH//$'\r'/}"
          ci_password_hash="${ci_password_hash//$'\n'/}"
          if [[ "$ci_password_hash" == \'*\' && "$ci_password_hash" == *\' ]]; then
            ci_password_hash="${ci_password_hash:1:${#ci_password_hash}-2}"
          fi
          if [[ "$ci_password_hash" == \"*\" && "$ci_password_hash" == *\" ]]; then
            ci_password_hash="${ci_password_hash:1:${#ci_password_hash}-2}"
          fi
          if [ -z "$ci_password_hash" ]; then
            echo "AUDIT_AUTH_PASSWORD_HASH resolves to empty after normalization"
            exit 1
          fi

          cat > .env <<EOF
          POSTGRES_DB=audit
          POSTGRES_USER=audit
          POSTGRES_PASSWORD=audit
          AUDIT_DB_URL=postgres://audit:audit@audit-db:5432/audit
          LOG_LEVEL=info
          AUDIT_INGEST_API_KEY=${CI_AUDIT_INGEST_API_KEY}
          AUDIT_READ_API_KEY=${CI_AUDIT_READ_API_KEY}
          AUDIT_AUTH_USER=${CI_AUDIT_AUTH_USER}
          AUDIT_AUTH_PASSWORD_HASH='${ci_password_hash}'
          AUDIT_SESSION_SECRET=${CI_AUDIT_SESSION_SECRET}
          AUDIT_SESSION_TTL_SECONDS=1800
          AUDIT_ALLOW_UNAUTHENTICATED_READS=false
          AUDIT_SESSION_COOKIE_SECURE=false
          EOF

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Security baseline (ruff S, bandit, pip-audit)
        run: |
          docker compose run --rm audit-api sh -lc "uv sync --frozen --group dev && uv tool run ruff check app --select S"
          docker compose run --rm audit-api sh -lc "uv sync --frozen --group dev && uv tool run bandit -r app"
          docker compose run --rm audit-api sh -lc "uv sync --frozen --group dev && uv tool run pip-audit"

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect \
            --source /repo \
            --redact \
            --no-banner \
            --exit-code 1

      - name: Trivy scan
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:latest fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            .

      - name: Shutdown stack
        if: always()
        run: docker compose down -v
