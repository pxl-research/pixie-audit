[project]
name = "pixie-audit-api"
version = "0.1.0"
description = "Audit API for Pixie"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "httpx>=0.28",
]
