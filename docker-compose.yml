services:
  audit-db:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
      target: audit-db
    container_name: pixie-audit-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audit}
      POSTGRES_USER: ${POSTGRES_USER:-audit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audit}
    volumes:
      - audit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

  audit-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
      target: audit-api
    container_name: pixie-audit-api
    env_file:
      - .env
    environment:
      AUDIT_DB_URL: ${AUDIT_DB_URL:-postgres://audit:audit@audit-db:5432/audit}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUDIT_INGEST_API_KEY: ${AUDIT_INGEST_API_KEY:?AUDIT_INGEST_API_KEY is required}
      AUDIT_READ_API_KEY: ${AUDIT_READ_API_KEY:?AUDIT_READ_API_KEY is required}
      AUDIT_AUTH_USER: ${AUDIT_AUTH_USER:?AUDIT_AUTH_USER is required}
      AUDIT_AUTH_PASSWORD_HASH: ${AUDIT_AUTH_PASSWORD_HASH:?AUDIT_AUTH_PASSWORD_HASH is required}
      AUDIT_SESSION_SECRET: ${AUDIT_SESSION_SECRET:?AUDIT_SESSION_SECRET is required}
      AUDIT_SESSION_TTL_SECONDS: ${AUDIT_SESSION_TTL_SECONDS:-1800}
      AUDIT_SESSION_COOKIE_SECURE: ${AUDIT_SESSION_COOKIE_SECURE:-true}
    depends_on:
      audit-db:
        condition: service_healthy
    ports:
      - "8019:8000"

volumes:
  audit-db-data:
