services:
  audit-db:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
      target: audit-db
    container_name: pixie-audit-db
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
    volumes:
      - audit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

  audit-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
      target: audit-api
    container_name: pixie-audit-api
    environment:
      AUDIT_DB_URL: postgres://audit:audit@audit-db:5432/audit
      LOG_LEVEL: info
      AUDIT_INGEST_API_KEY: audit-dev-ingest-key
      AUDIT_READ_API_KEY: audit-dev-read-key
      AUDIT_AUTH_USER: audit-admin
      AUDIT_AUTH_PASSWORD_HASH: '$$argon2id$$v=19$$m=65536,t=3,p=4$$7z/TbODs8007D/82hiXneg$$W3YBAqS7tOwuL1ug/CEQ2vy9CcVr4r3z0ueXP4FVD88'
      AUDIT_SESSION_SECRET: audit-dev-session-secret-change-me
      AUDIT_SESSION_TTL_SECONDS: "1800"
      AUDIT_ALLOW_UNAUTHENTICATED_READS: "false"
      AUDIT_SESSION_COOKIE_SECURE: "false"
    depends_on:
      audit-db:
        condition: service_healthy
    ports:
      - "8019:8000"

volumes:
  audit-db-data:
